tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks: []
tags:
  - cybersecurity
  - autonomous-agent
  - opengap-verified
metadata:
  repository: "https://github.com/ruchasalpure/bft-consensus-liveness-watchdog"
